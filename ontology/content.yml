requirements:
  purpose: Dar a coordenacao do Capstone uma camada semantica que responda, com fonte,
    quem participou de cada projeto (estudantes, cursos, orientador, banca, organizacao
    parceira), que entregas o projeto produziu, que certificacoes recebeu e que repercussao
    teve na midia, ligando esses fatos as regras do regulamento e dos manuais.
  scope: 'Dentro: projetos do periodo 2026.1 (projetos_com_links.csv e Capstone_2026_1.csv),
    pessoas e seus papeis, cursos, organizacoes parceiras, bancas finais, entregas,
    certificacao Falconi-Insper, materias na midia (2019 a 2026), regras de aprovacao,
    conceitos e probatorio do regulamento e do plano de aprendizagem. Fora: notas
    individuais (nao estao nos dados), alocacao semanal de horas, normas ABNT e instrucoes
    de formatacao de relatorio, banner e video.'
  users:
  - - Coordenacao do Capstone (Coordenador Geral, Vice-Coordenador e Comite do Capstone)
  use_cases:
  - name: Assistente da coordenacao do Capstone
    description: 'Responder perguntas da coordenacao sobre os projetos do Capstone:
      projetos por periodo, estudantes e seus cursos, orientadores, organizacoes parceiras,
      composicao das bancas, entregas (relatorios, video, banner, apresentacao), premiacoes
      e repercussao na midia.'
    actors:
    - Coordenacao do Capstone
    flow:
    - A coordenacao faz uma pergunta em linguagem natural sobre projetos, pessoas,
      organizacoes ou entregas
    - O assistente consulta a camada semantica sobre as planilhas de projetos e midia
    - O assistente responde citando os registros e, quando for regra, o regulamento
      ou manual de origem
    id: UC-01
  no_use_case: ''
  competency_questions:
  - question: Quem orientou um dado projeto e quem compos a sua banca final?
    type: relacao_entre_conceitos
    concepts:
    - Projeto
    - ProfessorOrientador
    - BancaFinal
    - MembroDeBanca
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: colunas Orientador e Banca Final, linha 1
      quote: Raphael Galdino dos Santos [orientador] | Silvio Szafir | Fabio Ferraz
        Junior
    id: CQ-003
    status: approved
    priority: high
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Em quantas bancas finais cada professor participou num periodo, separando
      as que ele orientou das que so avaliou?
    type: quantidade_agregacao
    concepts:
    - BancaFinal
    - MembroDeBanca
    - ProfessorOrientador
    - Periodo
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Banca Final, linhas 1 e 7
      quote: Silvio Szafir | Fabio Ferraz Junior ... Carlos Eduardo de Brito Novaes
        [orientador] | Fabio Ferraz Junior | Silvio Szafir
    id: CQ-008
    status: approved
    priority: medium
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Que papeis uma pessoa pode ter no Capstone (estudante, professor orientador,
      coorientador, membro de banca, mentor tecnico da organizacao parceira)?
    type: classificacao_hierarquia
    concepts:
    - Pessoa
    - Estudante
    - ProfessorOrientador
    - Coorientador
    - MembroDeBanca
    - MentorTecnico
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 3, Art. 8 e 9
      quote: Cada grupo do Projeto Final - Capstone contará com um Professor Orientador
        indicado pelo Comitê
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 5, Art. 14 II
      quote: alocar e garantir a disponibilidade de um Mentor Técnico para o acompanhamento
        dos estudantes
    id: CQ-001
    status: approved
    priority: medium
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: 'Projeto: titulo, numero, periodo, organizacao parceira, link da pagina
      e links de cada entrega.'
    type: atributos
    concepts:
    - Projeto
    - Entrega
    - Periodo
    - OrganizacaoParceira
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: colunas Projeto e Documentos, linha 1
      quote: https://pfe.insper.edu.br/projetos/projeto_infos/293
    id: CQ-006
    status: approved
    priority: high
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Quantos estudantes de cada curso participaram dos projetos de um periodo?
    type: quantidade_agregacao
    concepts:
    - Estudante
    - Curso
    - Periodo
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Estudantes, linha 8
      quote: Thiago de Moraes Regenga [EX] Lucas Sato Coelho de Oliveira [EM]
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 2, Art. 1
      quote: Engenharia de Computação, Engenharia Mecânica, Engenharia Mecatrônica
        e Ciência da Computação
    id: CQ-007
    status: reserved
    priority: medium
    answer: '48 estudantes: EC 19, EX 20, CC 6, EM 3'
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Que tipos de entrega um projeto produz (relatorio no servidor, relatorio
      no DSpace, video, banner, apresentacao da banca final)?
    type: classificacao_hierarquia
    concepts:
    - Entrega
    - Relatorio
    - Video
    - Banner
    - Apresentacao
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/Capstone_2026_1.csv
      locator: coluna Documentos, linha 1
      quote: RelatórioReport (Servidor) ... RelatórioReport (DSpace) ... Vídeo do
        Projeto ... Banner ... Apresentação da Banca Final
    id: CQ-002
    status: approved
    priority: medium
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Quais projetos cada organizacao parceira propos, e em que periodo?
    type: relacao_entre_conceitos
    concepts:
    - OrganizacaoParceira
    - Projeto
    - Periodo
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: colunas Organizacao e Periodo, linhas 1 e 2
      quote: A. C. Camargo Cancer Center ... 2026.1
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 2, Art. 6
      quote: Os estudantes serão apresentados a um conjunto de projetos propostos
        por Organizações Parceiras
    id: CQ-004
    status: approved
    priority: high
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Qual e o curso de cada estudante de um projeto?
    type: atributos
    concepts:
    - Estudante
    - Curso
    - Projeto
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Estudantes, linha 1
      quote: Antonio Lucas Michelon de Almeida [EC] Felipe Lisbona Fuchs [EX]
    id: CQ-005
    status: approved
    priority: high
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Que materias, publicacoes e eventos de encerramento sobre o Capstone
      sairam em cada ano, e sobre quais projetos?
    type: tempo_estado
    concepts:
    - MateriaNaMidia
    - Projeto
    - Periodo
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: colunas Data, Anotacoes e Projeto, linha 2
      quote: 06/09/2026 | Paper em Journal of Integrated Circuits and Systems | [CTI
        Renato Archer] Otimização de uma CPU RISC-V
    id: CQ-009
    status: approved
    priority: low
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  - question: Quais projetos receberam a certificacao Excelencia Falconi-Insper e
      que criterios um projeto precisa cumprir para recebe-la?
    type: regras_restricoes
    concepts:
    - Projeto
    - CertificacaoFalconi
    - BancaFalconi
    use_cases:
    - UC-01
    evidence:
    - kind: source
      path: data/AreaGeral/CertFalconyInsper_v4.pdf
      locator: pagina 1
      quote: Projetos com nota igual ou superior a 8,0 poderão concorrer ao certificado
        de Excelência ... limitados a no máximo 25% do total de projetos avaliados
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Projeto, linhas 1, 7, 8 e 11
      quote: Excelência Falconi
    id: CQ-010
    status: reserved
    priority: medium
    answer: 293, 305, 306, 313
    reviewed_by: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:45+00:00'
    proposed_by: agent
  gaps:
  - question: Quais estudantes foram aprovados, reprovados ou passaram pelo probatorio,
      e com que conceitos?
    reason: O regulamento e o plano de aprendizagem definem conceitos, Media Geral,
      Media Individual e probatorio, mas nenhuma planilha traz notas, conceitos ou
      resultado por estudante.
    missing: Conceitos por objetivo de aprendizagem, MG, MI, MF e situacao final por
      estudante
    evidence:
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 7, Art. 19, paragrafo unico
      quote: É considerado aprovado o estudante que obtenha média geral igual ou superior
        a 5.0, média individual igual ou superior a 5.0
    - kind: source
      path: data/AreaEstudantes/Manual_Capstone_Probation_2025c.pdf
      locator: pagina 2
      quote: O Probatório (Probation) é uma etapa adicional e obrigatória aplicada
        quando há insuficiência de evidências de aprendizagem
    id: L-03
    decision: request_from_client
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:07+00:00'
  - question: Quais foram todos os projetos de 2026.1?
    reason: 'A planilha de projetos tem 13 projetos (numeros 293 a 318), mas a planilha
      de midia cita projetos com numeros no mesmo intervalo que nao estao nela: 296
      (Apex Systems), 301 (BYX), 308 (Hospital Sirio-Libanes), 315 (Pinheiro Guimaraes).
      Hipotese minha: a lista de projetos esta incompleta.'
    missing: Lista completa dos projetos do periodo, com organizacao, orientador e
      estudantes
    evidence:
    - kind: source
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: coluna Documento, linha 1
      quote: https://pfe.insper.edu.br/arquivos/hsl/projeto308/lpsoares/
    - kind: source
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: coluna Projeto, linha 5
      quote: '[Apex Systems] AI-enabled COBOL Mainframe Modernization (Internacional)
        (Time Misto)'
    id: L-01
    decision: request_from_client
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:08+00:00'
  - question: Quais projetos receberam a certificacao Destaque Falconi-Insper, e com
      que nota na banca Falconi?
    reason: O documento da certificacao define dois niveis (Destaque com nota >= 6,0
      e Excelencia com nota >= 8,0), mas a planilha de projetos so marca 'Excelencia
      Falconi' no titulo e nao traz nota da banca Falconi.
    missing: Nivel da certificacao e nota da banca Falconi por projeto
    evidence:
    - kind: source
      path: data/AreaGeral/CertFalconyInsper_v4.pdf
      locator: pagina 1
      quote: Projetos avaliados pelas bancas Falconi que obtiverem nota igual ou superior
        a 6,0 receberão o certificado de Destaque
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Projeto, linha 1
      quote: tratamento do câncer Excelência Falconi
    id: L-02
    decision: request_from_client
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:08+00:00'
  - question: Quem foi o coorientador e o mentor tecnico de cada projeto?
    reason: O regulamento preve coorientador (Art. 9) e mentor tecnico da organizacao
      parceira (Art. 14), mas as planilhas so tem as colunas Orientador e Banca Final.
    missing: Coorientador, mentor tecnico e gestor responsavel por projeto
    evidence:
    - kind: source
      path: data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf
      locator: pagina 3, Art. 9
      quote: O Professor Orientador de um projeto poderá indicar um Coorientador
    - kind: source
      path: data/AreaGeral/projetos_com_links.csv
      locator: cabecalho
      quote: Projeto, Estudantes, Orientador, Organização, Banca Final, Período, Documentos
    id: L-04
    decision: request_from_client
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:08+00:00'
  divergences:
  - topic: Duas planilhas com os mesmos projetos de 2026.1
    sources:
    - label: Capstone_2026_1.csv
      path: data/AreaGeral/Capstone_2026_1.csv
      locator: coluna Estudantes, linha 1
      quote: Antonio Lucas Michelon de Almeida [Engenharia de Computação] [EC]
    - label: projetos_com_links.csv
      path: data/AreaGeral/projetos_com_links.csv
      locator: colunas Estudantes e Periodo, linha 1
      quote: Antonio Lucas Michelon de Almeida [EC] ... 2026.1
    hypothesis: 'Hipotese minha: sao o mesmo conteudo exportado duas vezes. projetos_com_links.csv
      deve prevalecer (tem Periodo e os links das entregas); Capstone_2026_1.csv serve
      so para confirmar o nome por extenso dos cursos.'
    id: D-01
    decision: precedence
    winner: projetos_com_links.csv
    reason: Tem Periodo e os links das entregas; Capstone_2026_1.csv so confirma o
      nome por extenso dos cursos
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:07+00:00'
  - topic: Projeto de CPU RISC-V com dois numeros
    sources:
    - label: materias_midia_com_links.csv
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: colunas Projeto e Documento, linha 2
      quote: '[CTI Renato Archer] Otimização de uma CPU RISC-V ... projeto276'
    - label: projetos_com_links.csv
      path: data/AreaGeral/projetos_com_links.csv
      locator: coluna Projeto, linha 6
      quote: 'Otimização de uma CPU RISC-V: https://pfe.insper.edu.br/projetos/projeto_infos/304'
    hypothesis: 'Hipotese minha: sao duas edicoes do mesmo desafio do CTI Renato Archer
      em periodos diferentes, e o numero do projeto (nao o titulo) identifica o projeto.'
    id: D-03
    decision: dismiss
    reason: Sao dois projetos distintos (edicoes diferentes); o numero do projeto
      e o identificador, nao o titulo
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:08+00:00'
  - topic: PFE e Capstone como nome do programa
    sources:
    - label: materias_midia_com_links.csv
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: coluna Anotacoes
      quote: Encerramento PFE 2026.1
    - label: materias_midia_com_links.csv
      path: data/AreaGeral/materias_midia_com_links.csv
      locator: coluna Anotacoes
      quote: Encerramento Capstone 2025.2
    - label: Capstone e a evolucao do PFE do Insper.pdf
      path: data/AreaGeral/Capstone é a evolução do PFE do Insper.pdf
      locator: pagina 1
      quote: Capstone é a evolução do PFE do Insper
    hypothesis: 'Hipotese minha: PFE (Projeto Final de Engenharia) e Capstone sao
      o mesmo programa em momentos diferentes e devem ser um so conceito, com PFE
      como sinonimo historico.'
    id: D-02
    decision: dismiss
    reason: PFE e Capstone sao o mesmo programa; PFE entra como sinonimo historico
      no glossario
    decided_by: Carlos Hernani
    decided_at: '2026-11-03T22:32:08+00:00'
terms:
- name: curso
  class: Curso
  definition: 'Curso de graduacao do estudante: EC, EX, CC ou EM (ver glossario).'
  synonyms:
  - graduacao
- name: projeto
  class: Projeto
  definition: Projeto Final - Capstone identificado pelo numero em pfe.insper.edu.br/projetos/projeto_infos/<numero>;
    o titulo nao e identificador.
  synonyms:
  - projeto capstone
  - PFE
  - TCC
- name: orientador
  class: ProfessorOrientador
  definition: Professor orientador do projeto, na coluna Orientador e marcado como
    [orientador] na banca final.
  synonyms:
  - professor orientador
  - advisor
- name: estudante
  class: Estudante
  definition: Estudante listado na coluna Estudantes de um projeto, com a sigla do
    curso entre colchetes.
  synonyms:
  - aluno
  - integrante do grupo
- name: periodo
  class: Periodo
  definition: Semestre letivo do projeto no formato ano.semestre.
  synonyms:
  - semestre
  - edicao
- name: membro_de_banca
  class: MembroDeBanca
  definition: Pessoa listada na coluna Banca Final de um projeto, incluindo o orientador.
  synonyms:
  - avaliador
  - banca
- name: banca_final
  class: BancaFinal
  definition: Conjunto de avaliadores da banca final de um projeto (coluna Banca Final).
  synonyms:
  - banca de avaliacao final
- name: organizacao_parceira
  class: OrganizacaoParceira
  definition: Organizacao que propos o projeto, na coluna Organizacao.
  synonyms:
  - empresa parceira
  - parceiro
  - patrocinador
- name: data_da_materia
  class: MateriaNaMidia
  definition: Data de publicacao da materia no formato DD/MM/AAAA; o ano vem dos quatro
    ultimos caracteres.
  synonyms:
  - data de publicacao
- name: entregas
  class: Entrega
  definition: Lista de entregas do projeto com seus links (RelatorioS, RelatorioB,
    Video, Banner, Apresentacao), na coluna Documentos.
  synonyms:
  - documentos
  - artefatos
- name: excelencia_falconi
  class: CertificacaoFalconi
  definition: Certificacao Excelencia Projeto Final - Capstone FALCONI-INSPER, marcada
    pelo texto 'Excelencia Falconi' no campo Projeto.
  synonyms:
  - Excelencia Falconi
  - certificacao de excelencia
- name: materia_na_midia
  class: MateriaNaMidia
  definition: 'Registro da planilha de midia: data, tipo (coluna Anotacoes), projeto
    citado e links.'
  synonyms:
  - materia
  - publicacao
  - noticia
- name: criterio_excelencia_falconi
  class: CriterioCertificacaoFalconi
  definition: 'Para receber Excelencia: banca unanime de alto nivel nas bancas intermediarias
    e finais, nota da banca Falconi >= 8,0, estar entre os melhores ate 25% dos projetos
    avaliados e ser aprovado no Capstone.'
  synonyms:
  - regra Falconi
- name: regra_de_aprovacao
  class: RegraDeAprovacao
  definition: Aprovado se MG >= 5,0, MI >= 5,0 e todos os objetivos de aprendizagem
    >= 5,0; se MI < 5,0, MF e a menor entre MG e MI; MG < 5,0 reprova automaticamente.
  synonyms:
  - criterio de aprovacao
- name: numero_de_bancas
  class: Metric
  definition: Quantidade de bancas finais de que uma pessoa participou, separavel
    entre como orientador e como avaliador.
  unit: bancas
  grain: uma participacao de uma pessoa numa banca final
  additivity: additive
- name: numero_de_estudantes
  class: Metric
  definition: Quantidade de estudantes distintos que participam dos projetos, contada
    por participacao estudante-projeto.
  unit: estudantes
  grain: uma participacao de um estudante em um projeto
  additivity: additive
- name: numero_de_projetos
  class: Metric
  definition: Quantidade de projetos distintos, contada pelo numero do projeto.
  unit: projetos
  grain: um projeto
  additivity: additive
mappings: []
relation_contracts:
- relation: propostoPor
  domain: Projeto
  range: OrganizacaoParceira
  inverse_of: propoe
  multiplicity: many_to_one
  no_join_reason: 'Nao ha tabela de organizacoes: o nome da organizacao esta na coluna
    Organizacao da propria linha do projeto em projetos_com_links.csv.'
- relation: ocorreEm
  domain: Projeto
  range: Periodo
  inverse_of: temProjeto
  multiplicity: many_to_one
  no_join_reason: 'Nao ha tabela de periodos: o periodo esta na coluna Periodo da
    linha do projeto.'
- relation: temBancaFinal
  domain: Projeto
  range: BancaFinal
  inverse_of: avalia
  multiplicity: one_to_one
  no_join_reason: A banca esta na coluna Banca Final da linha do projeto, como lista
    de nomes; nao ha tabela de bancas.
- relation: temEntrega
  domain: Projeto
  range: Entrega
  inverse_of: entregaDe
  multiplicity: one_to_many
  no_join_reason: As entregas e seus links estao na coluna Documentos da linha do
    projeto, como texto com varios itens.
- relation: recebeCertificacao
  domain: Projeto
  range: CertificacaoFalconi
  inverse_of: concedidaA
  multiplicity: many_to_one
  no_join_reason: A certificacao aparece como o texto 'Excelencia Falconi' dentro
    da coluna Projeto; nao ha coluna nem tabela propria.
- relation: mencionaProjeto
  domain: MateriaNaMidia
  range: Projeto
  inverse_of: mencionadoEm
  multiplicity: many_to_one
  no_join_reason: A coluna Projeto da planilha de midia traz '[Organizacao] titulo',
    que nao bate com o titulo de projetos_com_links.csv; o numero do projeto so aparece
    dentro da URL (projetoNNN). Nome parecido nao prova join.
- relation: matriculadoEm
  domain: Estudante
  range: Curso
  inverse_of: temMatriculado
  multiplicity: many_to_one
  no_join_reason: O curso aparece como sigla entre colchetes ([EC], [EX], [CC], [EM])
    dentro da coluna Estudantes; nao ha tabela de cursos.
- relation: temMembro
  domain: BancaFinal
  range: MembroDeBanca
  inverse_of: integraBanca
  multiplicity: many_to_many
  no_join_reason: 'Os membros estao na coluna Banca Final como lista de nomes; a mesma
    pessoa aparece em varias bancas (ex: Fabio Ferraz Junior nas linhas 1 e 7).'
- relation: temEstudante
  domain: Projeto
  range: Estudante
  inverse_of: participaDe
  multiplicity: one_to_many
  no_join_reason: Os estudantes estao todos na coluna Estudantes da linha do projeto,
    separados por quebra de linha; nao ha tabela de estudantes.
- relation: orientadoPor
  domain: Projeto
  range: ProfessorOrientador
  inverse_of: orienta
  multiplicity: many_to_one
  no_join_reason: O orientador esta na coluna Orientador da linha do projeto; nao
    ha tabela de professores.

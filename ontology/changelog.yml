    Data","quote":"09/09/2026"}'
  rationale: 'Hipotese do agente: o recorte segue o que as planilhas cobrem; manuais
    de formatacao ficam fora porque nao servem ao caso de uso da coordenacao.'
  payload:
    field: scope
    value: 'Dentro: projetos do periodo 2026.1 (projetos_com_links.csv e Capstone_2026_1.csv),
      pessoas e seus papeis, cursos, organizacoes parceiras, bancas finais, entregas,
      certificacao Falconi-Insper, materias na midia (2019 a 2026), regras de aprovacao,
      conceitos e probatorio do regulamento e do plano de aprendizagem. Fora: notas
      individuais (nao estao nos dados), alocacao semanal de horas, normas ABNT e
      instrucoes de formatacao de relatorio, banner e video.'

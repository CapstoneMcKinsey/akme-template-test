- edit_id: add_use_case-8ca2480d
  type: add_use_case
  proposed_by: agent
  approved_by: Carlos Hernani
  applied_at: '2026-11-03T22:32:06+00:00'
  requirement_id: null
  evidence: 'conversa: usuario escolheu ''Assistente da coordenacao'' com ator ''Coordenacao
    do Capstone'' em 2026-11-03'
  rationale: Caso de uso definido pelo humano; fluxo redigido pelo agente como proposta.
  payload:
    name: Assistente da coordenacao do Capstone
    description: 'Responder perguntas da coordenacao sobre os projetos do Capstone:
      projetos por periodo, estudantes e seus cursos, orientadores, organizacoes parceiras,
      composicao das bancas, entregas (relatorios, video, banner, apresentacao), premiacoes
      e repercussao na midia.'
    actors:
    - Coordenacao do Capstone
    flow:
    - A coordenacao faz uma pergunta em linguagem natural sobre projetos, pessoas,
      organizacoes ou entregas
    - O assistente consulta a camada semantica sobre as planilhas de projetos e midia
    - O assistente responde citando os registros e, quando for regra, o regulamento
      ou manual de origem
    id: UC-01
  review:
    decision: accept
    reviewer: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:59+00:00'
    edits: {}
    reason: ''
- edit_id: add_requirement-2157df73
  type: add_requirement
  proposed_by: agent
  approved_by: Carlos Hernani
  applied_at: '2026-11-03T22:32:06+00:00'
  requirement_id: UC-01
  evidence: '{"kind":"source","path":"data/AreaGeral/REGULAMENTO_Capstone_V250812.pdf","locator":"pagina
    2, Art. 4","quote":"responsável pelo acompanhamento geral das atividades e pela
    condução do Comitê do Capstone"}; conversa: caso de uso Assistente da coordenacao'
  rationale: Hipotese do agente a partir do caso de uso UC-01; o objetivo do Capstone
    (Art. 3) esta na fonte, o proposito da ontologia nao.
  payload:
    field: purpose
    value: Dar a coordenacao do Capstone uma camada semantica que responda, com fonte,
      quem participou de cada projeto (estudantes, cursos, orientador, banca, organizacao
      parceira), que entregas o projeto produziu, que certificacoes recebeu e que
      repercussao teve na midia, ligando esses fatos as regras do regulamento e dos
      manuais.
  review:
    decision: accept
    reviewer: Carlos Hernani
    reviewed_at: '2026-11-03T22:31:59+00:00'
    edits: {}
    reason: ''

- edit_id: add_gap-329a9a03
  type: add_gap
  proposed_by: agent
  approved_by: Carlos Hernani
  applied_at: '2026-11-03T22:32:07+00:00'
  requirement_id: UC-01
  evidence: ''
  rationale: ''
  payload:
    question: Quais estudantes foram aprovados, reprovados ou passaram pelo probatorio,
      e com que conceitos?
    reason: O regulamento e o plano de aprendizagem definem conceitos, Media Geral,
      Media Individual e probatorio, mas nenhuma planilha traz notas, conceitos ou
      resultado por estudante.
    missing: Conceitos por objetivo de aprendizagem, MG, MI, MF e situacao final por
      estudante
    evidence:

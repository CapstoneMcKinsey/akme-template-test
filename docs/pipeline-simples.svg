<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 370" width="1270" height="370" font-family="Inter, Arial, sans-serif">
  <rect width="1270" height="370" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1c1e2a">Pipeline do akme-template</text>

  <!-- Volta (manutenção) -->
  <path d="M1173 110 V80 H403 V102" fill="none" stroke="#8a8c94" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="403,110 398,102 408,102" fill="#8a8c94"/>
  <text x="788" y="72" font-size="12" fill="#6b6d75" text-anchor="middle">mudanças voltam à etapa certa (4 → 2 ou 3, 6 → 1 ou 3)</text>

  <!-- Linha principal -->
  <rect x="30" y="110" width="130" height="70" rx="8" fill="#f1f2f4" stroke="#c9cbd1"/>
  <text x="95" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Fontes</text>
  <text x="95" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">arquivos ou bancos</text>

  <rect x="184" y="110" width="130" height="70" rx="8" fill="#f1f2f4" stroke="#c9cbd1"/>
  <text x="249" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Preparação</text>
  <text x="249" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">init, connect, profile</text>

  <rect x="338" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="403" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">1. Especificar</text>
  <text x="403" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">casos de uso e CQs</text>

  <rect x="492" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="557" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">2. Conceitualizar</text>
  <text x="557" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">classes, relações, termos</text>

  <rect x="646" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="711" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">3. Codificar</text>
  <text x="711" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">mappings e regras</text>

  <rect x="800" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="865" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">4. Avaliar</text>
  <text x="865" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">validate e eval</text>

  <rect x="954" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="1019" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">5. Publicar</text>
  <text x="1019" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">export e publish</text>

  <rect x="1108" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="1173" y="140" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">6. Manter</text>
  <text x="1173" y="160" font-size="11" fill="#6b6d75" text-anchor="middle">mudanças com registro</text>

  <!-- Setas da linha principal -->
  <g stroke="#6b6d75" stroke-width="1.5">
    <line x1="162" y1="145" x2="176" y2="145"/>
    <line x1="316" y1="145" x2="330" y2="145"/>
    <line x1="470" y1="145" x2="484" y2="145"/>
    <line x1="624" y1="145" x2="638" y2="145"/>
    <line x1="778" y1="145" x2="792" y2="145"/>
    <line x1="932" y1="145" x2="946" y2="145"/>
    <line x1="1086" y1="145" x2="1100" y2="145"/>
  </g>
  <g fill="#6b6d75">
    <polygon points="184,145 176,140 176,150"/>
    <polygon points="338,145 330,140 330,150"/>
    <polygon points="492,145 484,140 484,150"/>
    <polygon points="646,145 638,140 638,150"/>
    <polygon points="800,145 792,140 792,150"/>
    <polygon points="954,145 946,140 946,150"/>
    <polygon points="1108,145 1100,140 1100,150"/>
  </g>

  <!-- Etapas 1-3 → revisão -->
  <line x1="557" y1="180" x2="557" y2="242" stroke="#1f9fe0" stroke-width="1.5"/>
  <polygon points="557,250 552,242 562,242" fill="#1f9fe0"/>
  <text x="567" y="220" font-size="12" fill="#0b7cc0">etapas 1 a 3: pare e pergunte</text>

  <!-- Ciclo de revisão -->
  <rect x="338" y="250" width="130" height="60" rx="8" fill="#ffffff" stroke="#9a9ca4"/>
  <text x="403" y="276" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Agente propõe</text>
  <text x="403" y="295" font-size="11" fill="#6b6d75" text-anchor="middle">com evidência</text>

  <rect x="492" y="250" width="130" height="60" rx="8" fill="#eaf6fd" stroke="#1f9fe0" stroke-width="1.5"/>
  <text x="557" y="276" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Você revisa</text>
  <text x="557" y="295" font-size="11" fill="#6b6d75" text-anchor="middle">aceita ou rejeita</text>

  <rect x="646" y="250" width="130" height="60" rx="8" fill="#eaf6fd" stroke="#1f9fe0" stroke-width="1.5"/>
  <text x="711" y="276" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Você aplica</text>
  <text x="711" y="295" font-size="11" fill="#6b6d75" text-anchor="middle">com seu nome</text>

  <line x1="470" y1="280" x2="484" y2="280" stroke="#6b6d75" stroke-width="1.5"/>
  <polygon points="492,280 484,275 484,285" fill="#6b6d75"/>
  <line x1="624" y1="280" x2="638" y2="280" stroke="#6b6d75" stroke-width="1.5"/>
  <polygon points="646,280 638,275 638,285" fill="#6b6d75"/>

  <path d="M711 310 V335 H403 V318" fill="none" stroke="#8a8c94" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="403,310 398,318 408,318" fill="#8a8c94"/>
  <text x="557" y="352" font-size="12" fill="#6b6d75" text-anchor="middle">próxima proposta</text>

  <!-- Publicação -->
  <line x1="1019" y1="180" x2="1019" y2="242" stroke="#6b6d75" stroke-width="1.5"/>
  <polygon points="1019,250 1014,242 1024,242" fill="#6b6d75"/>
  <rect x="954" y="250" width="284" height="60" rx="8" fill="#f1f2f4" stroke="#c9cbd1"/>
  <text x="1096" y="276" font-size="14" font-weight="600" fill="#1c1e2a" text-anchor="middle">Snowflake · Databricks · YAML · RDF</text>
  <text x="1096" y="295" font-size="11" fill="#6b6d75" text-anchor="middle">dry-run por padrão</text>
</svg>
